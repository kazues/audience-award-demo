<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票デモ | オーディエンス賞</title>
<style>
:root{font:100%/1.65 system-ui,sans-serif;color:#172d39;background:#eef4f5}
*{box-sizing:border-box}body{margin:0}header{background:#102b3b;color:white;padding:1rem}header div,main{max-width:38rem;margin:auto}main{padding:2rem 1rem}
h1{font-size:clamp(1.7rem,6vw,2.45rem);line-height:1.2;margin:.4rem 0 1rem}
section,form{padding:1.2rem;background:#fff;border:1px solid #d0dce0;border-radius:1rem;margin:1rem 0}
fieldset{border:0;padding:0;margin:0 0 1rem;min-width:0}legend{font-weight:700}
.choice{display:block;border:1px solid #b9cbd0;border-radius:.55rem;padding:.65rem;margin:.45rem 0;cursor:pointer}
.choice:has(:checked){background:#e1f5ed;border-color:#14674d}
input[type=radio]{accent-color:#14674d}label[for]{display:block;font-weight:700}
input[type=text]{font:inherit;width:100%;padding:.65rem;border:1px solid #879fa7;border-radius:.5rem;margin:.35rem 0 .8rem}
button{font:inherit;font-weight:700;border:0;border-radius:.55rem;padding:.6rem 1rem;color:white;background:#14674d;cursor:pointer}
button.secondary{background:#e5edf0;color:#173443}
:focus-visible{outline:3px solid #2671c5;outline-offset:3px}.error{color:#922e23}.success{color:#14674d;font-weight:700}
</style>
</head>
<body>
<header><div>データサイエンスコンペ · 投票デモ</div></header>
<main>
<h1>オーディエンス賞</h1>
<p>印象に残ったチームを1つ選んでください。このデモの投票記録は、このブラウザ内に保存されます。</p>
<form id="ballot">
<fieldset>
<legend>投票するチーム</legend>
<label class="choice"><input type="radio" name="team" value="地域データ分析チーム" required> 地域データ分析チーム</label>
<label class="choice"><input type="radio" name="team" value="需要予測チーム"> 需要予測チーム</label>
<label class="choice"><input type="radio" name="team" value="可視化チーム"> 可視化チーム</label>
</fieldset>
<label for="code">投票コード</label>
<input id="code" name="code" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-help" required>
<div id="code-help">お試し用コードは <strong>DEMO-2026</strong> です。</div>
<p><button type="submit">選んだチームに投票する</button></p>
</form>
<section aria-labelledby="receipt-title" id="receipt" hidden>
<h2 id="receipt-title">投票記録</h2>
<p id="selection"></p>
</section>
<p id="message" role="status" aria-live="polite"></p>
<button class="secondary" id="reset" type="button" hidden>デモの投票をリセット</button>
<script>
const key = 'audience-award-demo-vote-v1';
const form = document.querySelector('#ballot');
const receipt = document.querySelector('#receipt');
const selection = document.querySelector('#selection');
const message = document.querySelector('#message');
const reset = document.querySelector('#reset');
let fallbackVote = '';
let storageAvailable = true;
function savedVote() {
  try {
    return localStorage.getItem(key) || '';
  } catch {
    storageAvailable = false;
    return fallbackVote;
  }
}
function updateReceipt() {
  const team = savedVote();
  receipt.hidden = !team;
  reset.hidden = !team;
  selection.textContent = team ? team + ' に投票しました。' : '';
}
function show(text, kind) {
  message.textContent = text;
  message.className = kind;
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const fields = new FormData(form);
  if (fields.get('code').trim().toUpperCase() !== 'DEMO-2026') {
    show('投票コードを確認してください。お試し用コードは DEMO-2026 です。', 'error');
    return;
  }
  if (savedVote()) {
    updateReceipt();
    show('このデモコードはすでに使用されています。再度試すにはリセットしてください。', 'error');
    return;
  }
  const team = fields.get('team');
  try {
    localStorage.setItem(key, team);
  } catch {
    fallbackVote = team;
    storageAvailable = false;
  }
  updateReceipt();
  show(storageAvailable ? '投票を受け付けました。' : '投票を受け付けました。この環境ではページを閉じると記録が消えます。', 'success');
});
reset.addEventListener('click', () => {
  try { localStorage.removeItem(key); } catch {}
  fallbackVote = '';
  form.reset();
  updateReceipt();
  show('デモの投票記録をリセットしました。', 'success');
});
updateReceipt();
</script>
</main>
</body>
</html>
